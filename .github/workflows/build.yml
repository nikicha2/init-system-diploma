name: Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build project
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Archive build output
        run: |
          mkdir -p dist

          tar -czf dist/init-system-diploma-x86_64-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release \
            init-system-diploma

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: init-system-diploma
          path: dist/init-system-diploma-x86_64-linux-musl.tar.gz

  release:
    name: Publish Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: init-system-diploma
          path: dist

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/init-system-diploma-x86_64-linux-musl.tar.gz
